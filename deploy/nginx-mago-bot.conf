# Mago Bot - aaPanel/Nginx
# Ajuste o domínio e os caminhos dos certificados somente se necessário.

server {
    listen 80;
    server_name mago-bot.com;

    location ^~ /.well-known/ {
        root /www/wwwroot/mago-bot.com/mago-bot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name mago-bot.com;

    root /www/wwwroot/mago-bot.com/mago-bot;

    include /www/server/panel/vhost/nginx/extension/mago-bot.com/*.conf;
    include /www/server/panel/vhost/nginx/well-known/mago-bot.com.conf;

    ssl_certificate    /www/server/panel/vhost/cert/mago-bot.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/mago-bot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497 https://$host$request_uri;
    error_page 502 /502.html;

    client_max_body_size 20m;

    location ^~ /.well-known/ {
        allow all;
    }

    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    access_log /www/wwwlogs/mago-bot.com.log;
    error_log /www/wwwlogs/mago-bot.com.error.log;
}
